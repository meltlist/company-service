<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 企业 RAG 知识库</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">📚 企业 RAG 知识库</h1>
            <p class="text-gray-500 mt-2">登录到您的账户</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-sm text-gray-600 mb-1">用户名</label>
                <input type="text" id="username" required
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="输入用户名">
            </div>
            <div class="mb-6">
                <label class="block text-sm text-gray-600 mb-1">密码</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="输入密码">
            </div>
            <div id="errorMsg" class="text-red-500 text-sm mb-4 hidden"></div>
            <button type="submit" id="loginBtn"
                class="w-full py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 transition-colors">
                登录
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/register" class="text-blue-600 hover:underline">还没有账户？立即注册</a>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.textContent = '登录中...';
            errorMsg.classList.add('hidden');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || data.error || data.message || '登录失败');
                }

                localStorage.setItem('token', data.access_token);
                window.location.href = '/';
            } catch (e) {
                errorMsg.textContent = e.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }
    </script>
</body>
</html>
