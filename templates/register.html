<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 企业 RAG 知识库</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">📚 企业 RAG 知识库</h1>
            <p class="text-gray-500 mt-2">创建您的账户</p>
        </div>

        <form onsubmit="handleRegister(event)">
            <div class="mb-4">
                <label class="block text-sm text-gray-600 mb-1">企业名称</label>
                <input type="text" id="enterpriseName" required
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="输入企业名称">
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-600 mb-1">用户名</label>
                <input type="text" id="username" required
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="输入用户名">
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-600 mb-1">邮箱</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="输入邮箱">
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-600 mb-1">姓名</label>
                <input type="text" id="fullName"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="输入姓名（可选）">
            </div>
            <div class="mb-6">
                <label class="block text-sm text-gray-600 mb-1">密码</label>
                <input type="password" id="password" required minlength="6"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="至少6位密码">
            </div>
            <div id="errorMsg" class="text-red-500 text-sm mb-4 hidden"></div>
            <button type="submit" id="registerBtn"
                class="w-full py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 transition-colors">
                注册
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/login" class="text-blue-600 hover:underline">已有账户？立即登录</a>
        </div>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.textContent = '注册中...';
            errorMsg.classList.add('hidden');

            const enterpriseName = document.getElementById('enterpriseName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const fullName = document.getElementById('fullName').value;
            const password = document.getElementById('password').value;

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                formData.append('email', email);
                formData.append('enterprise_name', enterpriseName);
                if (fullName) formData.append('full_name', fullName);

                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || '注册失败');
                }

                localStorage.setItem('token', data.access_token);
                window.location.href = '/';
            } catch (e) {
                errorMsg.textContent = e.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = '注册';
            }
        }
    </script>
</body>
</html>
